# Render Blueprint for the Ace Laundry backend API.
# Docs: https://render.com/docs/blueprint-spec
#
# The Next.js frontend deploys to Vercel (repo subdirectory: App). This file
# provisions only the API service on Render.
#
# To deploy:
#   1. Push this file to GitHub (main).
#   2. In the Render dashboard choose "New" -> "Blueprint" and connect this repo.
#   3. Render provisions ace-laundry-api. Fill every "sync: false" secret from
#      backend/.env in the service's Environment dashboard.
#   4. Set FRONTEND_URL and SL_ORIGIN to the deployed Vercel URL (a full https
#      URL, or a bare host is also accepted and the API prefixes https://).
#   5. In the Vercel project set NEXT_PUBLIC_API_URL to this API's URL, e.g.
#      https://ace-laundry-api.onrender.com
#
# Secrets are intentionally NOT committed here. Each "sync: false" var must be
# set once in the Render dashboard (values come from backend/.env).

services:
  - type: web
    name: ace-laundry-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /public/config
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; env.ts reads it.
      - key: DATABASE_URL
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: OPERATOR_SESSION_SECRET
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_PAYMENT_EMAIL
        sync: false
      - key: FLUTTERWAVE_ENV
        value: test
      - key: OPERATOR_EMAIL
        sync: false
      - key: SL_API_KEY
        sync: false
      - key: SL_ORIGIN
        sync: false
      - key: SL_FROM
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
